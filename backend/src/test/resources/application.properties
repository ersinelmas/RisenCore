# --- H2 Database Configuration for Tests ---
# Use an in-memory database instance named 'testdb'
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA/Hibernate Configuration for H2 ---
# This dialect helps Hibernate generate SQL compatible with H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Tests use Hibernate ddl-auto (below) to build the schema from entities, not Flyway.
# Flyway's versioned SQL scripts are hand-written for PostgreSQL and are not guaranteed
# to be H2-syntax-compatible (e.g. V5 uses an unquoted "value" column, which is a
# reserved word in H2). Running both against the ephemeral H2 test DB is redundant and
# was causing every *IT test to fail at context startup.
spring.flyway.enabled=false

# ddl-auto=create-drop: On startup, drop the existing schema and create a new one.
# When the context closes, drop the schema. This ensures each test run is clean.
spring.jpa.hibernate.ddl-auto=create-drop

# Optional: Shows the SQL generated by Hibernate in the console during tests
spring.jpa.show-sql=true

# --- JWT Configuration for Tests ---
# Use a static, known secret for tests. It doesn't need to be the same as production.
application.security.jwt.secret-key=NDY4ZDEyYjQ4NTlhN2Y5OTdmYjU3ZDUxNTU4YWE1MTQ2ODZkNDM4YjYxYmU5MjYwYjBlY2MyMmY2MjI1YjUwMw==
application.security.jwt.expiration=86400000

# --- Gemini AI Configuration for Tests ---
# Dummy value so GeminiAIServiceImpl can be constructed during context startup.
# No test makes a real call to the Gemini API with this key.
gemini.api.key=test-gemini-api-key
gemini.model.name=gemini-2.5-flash